<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Services</title>
    <link rel="stylesheet" href="beauty.css">
</head>
<body>

<header>
    <h1>Beauty services at your doorstep</h1>
</header>

<section class="services">
    <div class="category-container">
        <h2>What are you looking for?</h2>
        <div class="categories">
            <div class="category">
                <img src="salon_women.png" alt="Salon for Women">
                <p>Salon for Women</p>
            </div>
            <div class="category">
                <img src="spa_women.png" alt="Spa for Women">
                <p>Spa for Women</p>
            </div>
            <div class="category">
                <img src="hair_studio.png" alt="Hair Studio for Women">
                <p>Hair Studio for Women</p>
            </div>
            <div class="category">
                <img src="makeup_studio.png" alt="Makeup & Styling Studio">
                <p>Makeup & Styling Studio</p>
            </div>
            <div class="category">
                <img src="salon_prime.png" alt="Salon Prime for Kids & Men">
                <p>Salon Prime for Kids & Men</p>
            </div>
            <div class="category">
                <img src="massage_men.png" alt="Massage for Men">
                <p>Massage for Men</p>
            </div>
        </div>
    </div>

    <div class="service-images">
        <img src="beauty1.jpg" alt="Service 1">
        <img src="beauty2.jpg" alt="Service 2">
        <img src="beauty3.jpg" alt="Service 3">
        <img src="beauty4.jpg" alt="Service 4">
    </div>
</section>

<section class="ratings">
    <div class="rating">
        <span>⭐</span>
        <p>4.8</p>
        <p>Service Rating</p>
    </div>
    <div class="customers">
        <span>👥</span>
        <p>12M+</p>
        <p>Customers Globally</p>
    </div>
</section>

</body>
</html>
