<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>
    <link rel="stylesheet" href="log.css">
</head>
<body>
    <div class="overlay">
        <div class="container">
            <h1>Login as a Customer</h1>
            <form id="customer-login-form" action="customer_login.php" method="POST"></form>
            <form id="customer-login-form" action="customer_dashboard.html" method="POST">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required placeholder="Enter your username">
                
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter your password">
                
                <button type="submit" class="button">Login</button>
            </form>
            <p class="signup-text">Not a customer yet? <a href="signup.html" class="signup-link">Sign up!</a></p>
        </div>
    </div>

    <script src="log.js"></script>
</body>
</html>
